[workspace]
authors = ["Manish Reddy <kreddy.manish@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "modlearn"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
modular = ">=26.6.0,<27"

# Apple-GPU kernels need the Metal compiler, which ships with full Xcode, not the Command Line Tools.
# Setup once: install Xcode, then run `xcodebuild -downloadComponent MetalToolchain` (with this DEVELOPER_DIR).
[target.osx-arm64.activation.env]
DEVELOPER_DIR = "/Applications/Xcode.app/Contents/Developer"
