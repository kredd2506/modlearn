name: Chip or Software? · MAX on Qualcomm
description: >
    Re-running a published Qualcomm Cloud AI 100 Ultra vs NVIDIA A100 LLM-serving
    benchmark with Modular's MAX and Mojo, to test whether its conclusions came from the
    hardware or from the software stack.
about: >
    An open, reproducible benchmarking study of LLM inference on Qualcomm and NVIDIA
    accelerators, and a learning log for Mojo and MAX.

